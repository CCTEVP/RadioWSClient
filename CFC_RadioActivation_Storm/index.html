<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Opened without a trailing slash? Reload with one so the relative
      // ./styles.css, ./app.js and ./img/ paths resolve inside this folder.
      if (!/(\/|\.html?)$/i.test(location.pathname) && location.protocol !== "file:") {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayerStorm - WebSocket Image Display</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Container to center and constrain to 382x720 -->
    <div class="display-container">
      <!-- Main display image -->
      <img id="displayImage" src="./img/image_01.jpg" alt="Display" />

      <!-- Optional connection status indicator -->
      <div id="statusIndicator"></div>
    </div>

    <!-- WebSocket connection script -->
    <script src="./app.js"></script>
  </body>
</html>
